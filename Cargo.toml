[package]
name = "fleet"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ctrlc = "3.5.2"
p256 = { version = "0.13.2", default-features = false, features = ["arithmetic", "pem", "std"] }
ratatui = "0.30.2"
rcgen = "0.14"
rustix = { version = "1.1", features = ["fs", "process"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3.27.0"
